[project]
name = "ai-powered-document-intelligence-platform"
version = "0.1.0"
description = "extract knowledge from documents"
authors = [
    {name = "Alireza Aliabadi"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "langchain (>=1.3.4,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-openai (>=1.2.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "pymupdf (>=1.27.2.3,<2.0.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic (>=2.13.4,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)"
]

[project.optional-dependencies]
dev = [
  "autopep8>=2.0,<3.0",
  "pytest>=8.0,<9.0",
  "pytest-django>=4.0,<5.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "django-stubs[compatible-mypy]>=5.0,<6.0"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "storefront.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = false
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "storefront.settings"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
