name: ai-document-platform

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ai_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-redis_password}","ping"]
    networks: [backend]

  mongodb:
    image: mongo:8
    restart: unless-stopped
    env_file: .env
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
    networks: [backend]

  aistor:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - aistor_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:9000/minio/health/live"]
    networks: [backend]

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [backend]

  celery_worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l INFO
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  celery_beat:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat -l INFO
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [frontend, backend]

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  aistor_data:

networks:
  backend:
  frontend:
