version: '3.9'

services:
  # Database Service
  postgres:
    image: postgres:18-alpine
    container_name: ai_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ai_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service (Message Broker & Cache)
  redis:
    image: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Service (Vector Store/Document Metadata)
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aistor Service (S3-compatible Object Storage)
  aistor:
    image: quay.io/minio/aistor/minio:latest
    container_name: ai_platform_aistor
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/mnt/data
      - ./certs:/etc/minio/certs
      - ./minio.license:/minio.license
    environment:
      MINIO_ROOT_USER: ${AI_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AI_STORAGE_SECRET_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_platform_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput || true &&\
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ai_platform}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-mongo_password}@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DATABASE:-ai_platform}
      AI_STORAGE_ENDPOINT: aistor:9000
      AI_STORAGE_ACCESS_KEY: ${AI_STORAGE_ACCESS_KEY:-minioadmin}
      AI_STORAGE_SECRET_KEY: ${AI_STORAGE_SECRET_KEY:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/backend/static
      - media_volume:/app/backend/media
    depends_on:
      - postgres
      - redis
      - mongodb
      - aistor
    networks:
      - ai_network

  # Celery Worker Service
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_platform_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-mongo_password}@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DATABASE:-ai_platform}
      AI_STORAGE_ENDPOINT: aistor:9000
      AI_STORAGE_ACCESS_KEY: ${AI_STORAGE_ACCESS_KEY:-minioadmin}
      AI_STORAGE_SECRET_KEY: ${AI_STORAGE_SECRET_KEY:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - mongodb
      - aistor
    networks:
      - ai_network

  # Celery Beat Service (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_platform_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-mongo_password}@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DATABASE:-ai_platform}
      AI_STORAGE_ENDPOINT: aistor:9000
      AI_STORAGE_ACCESS_KEY: ${AI_STORAGE_ACCESS_KEY:-minioadmin}
      AI_STORAGE_SECRET_KEY: ${AI_STORAGE_SECRET_KEY:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - postgres
    networks:
      - ai_network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_platform_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      NODE_ENV: production
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/public:/app/frontend/public:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - ai_network
volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  static_volume:
  media_volume:

networks:
  ai_network:
    driver: bridge
